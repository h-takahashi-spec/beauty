<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美人投票ゲーム</title>
<!--
  ============================================================
  ケインズの美人投票ゲーム（p-beauty contest, p = 2/3）
  ------------------------------------------------------------
  各学生が 0〜100 の整数を、相手の教示だけを変えて 3 回答える。
    human  : 相手は「この授業の受講生全員」   … 本番。勝者は結果ページで発表
    random : 相手は「0〜100 をでたらめに選ぶプログラム 99 個」
    ai     : 相手は「完全に合理的に考える AI 99 体」
  human は常に最初（他の条件を見る前の素の推論を取るため）。
  random と ai の順番はランダム（order 列に記録）。

  ?s=2 のように URL に付けると「セッション番号」が変わる
  （結果を見せたあと、もう一度やらせる2回戦などに使う）。何も付けなければ s=1。

  データ送信：下の GAS_URL に Google Apps Script のウェブアプリURLを入れる。
  ---- Google Apps Script（スプレッドシート → 拡張機能 → Apps Script に貼る）----
  const COLS = ["timestamp","session","student_id","nickname","order",
    "guess_human","guess_random","guess_ai","pred_mean_human",
    "reason_human","rt_human_sec","total_sec","ua"];
  function doPost(e) {
    const lock = LockService.getScriptLock();
    lock.waitLock(20000);
    try {
      const sh = SpreadsheetApp.getActiveSpreadsheet().getSheets()[0];
      const d = JSON.parse(e.postData.contents);
      if (sh.getLastRow() === 0) sh.appendRow(COLS);
      sh.appendRow(COLS.map(k => k === "timestamp" ? new Date() : (d[k] ?? "")));
      return ContentService.createTextOutput(JSON.stringify({ok:true}))
        .setMimeType(ContentService.MimeType.JSON);
    } finally { lock.releaseLock(); }
  }
  // 結果ページ用：学籍番号を取り除いて返す
  function doGet(e) {
    const sh = SpreadsheetApp.getActiveSpreadsheet().getSheets()[0];
    const v = sh.getDataRange().getValues();
    if (v.length < 2) return out([]);
    const h = v[0];
    const rows = v.slice(1).map(r => {
      const o = {}; h.forEach((k,i) => { if (k !== "student_id") o[k] = r[i]; }); return o;
    });
    return out(rows);
  }
  function out(x){ return ContentService.createTextOutput(JSON.stringify(x))
    .setMimeType(ContentService.MimeType.JSON); }
  ---- デプロイ：「デプロイ」→「新しいデプロイ」→ 種類「ウェブアプリ」
       実行ユーザー「自分」、アクセス「全員」→ 出てきたURLを GAS_URL に貼る ----
  ============================================================
-->
<style>
  :root{
    --bg:#f6f1e8; --card:#fffdf8; --ink:#1f2430; --sub:#6b6f7a; --line:#e2d9c8;
    --accent:#c2410c; --accent-soft:#fde7d9; --human:#c2410c; --random:#4b5563; --ai:#1d4ed8;
    --ok:#15803d; --err:#b91c1c;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17181c; --card:#212329; --ink:#ecebe7; --sub:#a3a3a8; --line:#34363d;
      --accent:#fb923c; --accent-soft:#3a2516; --human:#fb923c; --random:#a1a1aa; --ai:#60a5fa;
      --ok:#4ade80; --err:#f87171;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
    line-height:1.7;-webkit-text-size-adjust:100%}
  main{max-width:640px;margin:0 auto;padding:20px 16px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px;margin:14px 0}
  h1{font-size:1.5rem;margin:.2em 0 .1em;letter-spacing:.02em}
  h2{font-size:1.15rem;margin:0 0 .6em}
  .kicker{font-size:.8rem;color:var(--accent);font-weight:700;letter-spacing:.12em}
  .sub{color:var(--sub);font-size:.92rem}
  .rule{background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin:12px 0}
  .rule b{color:var(--accent)}
  .formula{font-size:1.05rem;text-align:center;margin:10px 0;font-weight:700}
  label.f{display:block;font-weight:700;margin:14px 0 6px}
  input[type=text],input[type=number],textarea{width:100%;font:inherit;font-size:1rem;padding:12px;
    border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
  textarea{min-height:90px;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .big{font-size:2.6rem!important;text-align:center;font-weight:800;letter-spacing:.05em;padding:10px!important}
  button{font:inherit;font-weight:700;font-size:1.05rem;border:none;border-radius:12px;padding:14px 18px;
    width:100%;margin-top:18px;background:var(--accent);color:#fff;cursor:pointer}
  button:disabled{opacity:.4;cursor:default}
  .err{color:var(--err);font-size:.9rem;min-height:1.2em;margin-top:6px}
  .opp{display:flex;gap:14px;align-items:center;border-radius:14px;padding:16px;margin:10px 0 4px;border:2px solid}
  .opp .ico{font-size:2.4rem;line-height:1}
  .opp .who{font-weight:800;font-size:1.1rem}
  .opp.human{border-color:var(--human)} .opp.random{border-color:var(--random)} .opp.ai{border-color:var(--ai)}
  .steps{display:flex;gap:6px;margin:4px 0 2px}
  .steps span{flex:1;height:5px;border-radius:3px;background:var(--line)}
  .steps span.on{background:var(--accent)}
  .note{font-size:.85rem;color:var(--sub);margin-top:14px}
  .done{text-align:center}
  .gift{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border:2px solid var(--accent);
    border-radius:12px;padding:12px 14px;margin:12px 0;font-size:.98rem;line-height:1.6}
  .gift b{color:var(--accent)}
  .gift .gi{font-size:1.7rem;flex:none}
  .done .ico{font-size:3rem}
</style>
</head>
<body>
<main id="app"></main>
<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbztok7W_7t7ZAaQ_dGaMJW9OqO4z07i4oXLPcxFA4sqxidfCsaezBXeM09VwR9yZIEj/exec";   // ← Apps Script のウェブアプリURLを貼る

const params = new URLSearchParams(location.search);
const SESSION = params.get("s") || "1";
const OPP = {
  human:  {ico:"🧑‍🎓", who:"この授業の受講生 全員",
           desc:"今この教室でゲームに参加している受講生全員が相手です。みんなも同じルールで数字を選んでいます。"},
  random: {ico:"🎲", who:"でたらめに数字を選ぶプログラム 99個",
           desc:"相手は、0〜100の中から<b>まったくランダムに</b>数字を選ぶコンピュータプログラム99個です。何も考えずにサイコロを振っているだけです。"},
  ai:     {ico:"🤖", who:"完全に合理的に考えるAI 99体",
           desc:"相手は、<b>完全に合理的に考え、相手も合理的だと知っている</b>AI 99体です。どのAIも、勝つためにとことん考え抜いて数字を選びます。"},
};
const rest = Math.random() < .5 ? ["random","ai"] : ["ai","random"];
const ORDER = ["human", ...rest];

const S = {step:0, sid:"", nick:"", g:{}, pred:"", reason:"", t0:Date.now(), tHuman:null, tShow:null};
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function steps(n){ return `<div class="steps">${[0,1,2].map(i=>`<span class="${i<=n?'on':''}"></span>`).join("")}</div>`; }

function intro(){
  app.innerHTML = `
  <div class="card">
    <div class="kicker">コンピュータインタラクション ワーク</div>
    <h1>美人投票ゲーム</h1>
    <p class="sub">経済学者ケインズが「株式投資は美人投票に似ている」と言ったことにちなむゲームです。</p>
    <div class="rule">
      <p style="margin:0 0 6px">参加者は全員、<b>0〜100の整数</b>を1つ選びます。</p>
      <div class="formula">全員の数字の平均 × 2/3</div>
      <p style="margin:6px 0 0">に<b>いちばん近い数字</b>を選んだ人が勝ちです。</p>
    </div>
    <p>このあと、<b>相手が違う3つの場面</b>で、それぞれ数字を選んでもらいます。正解・不正解は成績に関係ありません。自分が勝てると思う数字を選んでください。</p>
    <div class="gift"><span class="gi">🍪</span><span><b>場面 1</b> でいちばん近かった人には<b>お菓子をプレゼント！</b><br><span class="sub">何人いても全員にプレゼントします</span></span></div>
    <label class="f">学籍番号</label>
    <input type="text" id="sid" inputmode="latin" autocomplete="off" placeholder="例：25T0123">
    <label class="f">ニックネーム <span class="sub" style="font-weight:400">（勝者発表でスクリーンに出ます。お菓子はこの名前で呼びます。本名は避けてください）</span></label>
    <input type="text" id="nick" maxlength="16" autocomplete="off" placeholder="例：ひでまん">
    <div class="err" id="err"></div>
    <button id="go">はじめる</button>
  </div>`;
  document.getElementById("go").onclick = () => {
    const sid = document.getElementById("sid").value.trim();
    const nick = document.getElementById("nick").value.trim();
    if (!/^[0-9A-Za-z]{4,12}$/.test(sid)) { document.getElementById("err").textContent = "学籍番号を半角英数字で入力してください"; return; }
    if (!nick) { document.getElementById("err").textContent = "ニックネームを入力してください"; return; }
    S.sid = sid; S.nick = nick; round();
  };
}

function round(){
  const k = ORDER[S.step], o = OPP[k];
  S.tShow = Date.now();
  app.innerHTML = `
  <div class="card">
    ${steps(S.step)}
    <div class="kicker">場面 ${S.step+1} / 3</div>
    <h2>あなたの相手は…</h2>
    <div class="opp ${k}"><div class="ico">${o.ico}</div><div><div class="who">${o.who}</div></div></div>
    <p>${o.desc}</p>
    ${k==="human" ? `<div class="gift"><span class="gi">🍪</span><span>この場面でいちばん近かった人には<b>お菓子をプレゼント！</b></span></div>` : ""}
    <div class="rule" style="margin-top:6px"><div class="formula" style="margin:0">あなたも含めた全員の平均 × 2/3 に<br>いちばん近い人が勝ち</div></div>
    <label class="f">あなたが選ぶ数字（0〜100の整数）</label>
    <input type="number" id="g" class="big" inputmode="numeric" min="0" max="100" step="1">
    ${k==="human" ? `
      <label class="f">受講生全員の平均は、いくつくらいになると思いますか？</label>
      <input type="number" id="pred" inputmode="decimal" min="0" max="100" step="any" placeholder="0〜100">
      <label class="f">その数字を選んだ理由を、かんたんに書いてください</label>
      <textarea id="reason" placeholder="例：みんなは〇〇くらいを選ぶと思うので…"></textarea>` : ""}
    <div class="err" id="err"></div>
    <button id="next">${S.step<2 ? "決定して次へ" : "決定して送信"}</button>
  </div>`;
  document.getElementById("g").focus();
  document.getElementById("next").onclick = () => {
    const err = document.getElementById("err");
    const raw = document.getElementById("g").value;
    const g = Number(raw);
    if (raw === "" || !Number.isInteger(g) || g < 0 || g > 100) { err.textContent = "0〜100の整数を入れてください"; return; }
    if (k === "human") {
      const pr = document.getElementById("pred").value;
      const p = Number(pr);
      if (pr === "" || isNaN(p) || p < 0 || p > 100) { err.textContent = "予想する平均を0〜100で入れてください"; return; }
      const r = document.getElementById("reason").value.trim();
      if (r.length < 2) { err.textContent = "理由をかんたんに書いてください"; return; }
      S.pred = p; S.reason = r; S.tHuman = (Date.now() - S.tShow)/1000;
    }
    S.g[k] = g;
    S.step++;
    if (S.step < 3) round(); else send();
  };
}

async function send(){
  const d = {
    session: SESSION, student_id: S.sid, nickname: S.nick, order: ORDER.join(">"),
    guess_human: S.g.human, guess_random: S.g.random, guess_ai: S.g.ai,
    pred_mean_human: S.pred, reason_human: S.reason,
    rt_human_sec: S.tHuman?.toFixed(1), total_sec: ((Date.now()-S.t0)/1000).toFixed(1),
    ua: navigator.userAgent,
  };
  app.innerHTML = `<div class="card done"><div class="ico">⏳</div><p>送信しています…</p></div>`;
  let ok = true;
  if (GAS_URL) {
    try {
      await fetch(GAS_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(d)});
    } catch(e) { ok = false; }
  }
  app.innerHTML = ok ? `
    <div class="card done">
      <div class="ico">🗳️</div>
      <h2>投票しました！</h2>
      <p>あなたの数字<br>
        <span style="color:var(--human)">🧑‍🎓 受講生相手：<b>${S.g.human}</b></span>
        <span style="color:var(--random)">🎲 でたらめ相手：<b>${S.g.random}</b></span>
        <span style="color:var(--ai)">🤖 合理的AI相手：<b>${S.g.ai}</b></span></p>
      <div class="gift" style="text-align:left"><span class="gi">🍪</span><span>場面 1（受講生相手）でいちばん近かった人には<b>お菓子をプレゼント！</b></span></div>
      <p class="sub">勝者はこのあとスクリーンで発表します。<br>ニックネーム「${esc(S.nick)}」が呼ばれるか見ていてください。</p>
    </div>` : `
    <div class="card">
      <h2>送信できませんでした</h2>
      <p>通信状況を確認して、先生に伝えてください。下の内容をコピーして提出できます。</p>
      <textarea readonly style="min-height:140px">${esc(JSON.stringify(d))}</textarea>
    </div>`;
}

intro();
</script>
</body>
</html>
